[package]
name = "blitzserver"
version = "1.0.0-rc.25"
authors = ["Blitzserver Admin <admin@blitzserver.net"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "*"
serde = { version = "*", features = ["derive"] }
dotenv = "*"
askama = "0.10.5"
r2d2 = "*"
r2d2_postgres = "*"
actix-multipart = "*"
actix-files = "*"
futures = "*"
regex = "*"
crossbeam-channel = "*"
notify = { version = "5.0.0-pre.4", features = ["serde"] }
byteorder = "*"
num_enum = "*"
zip = "*"
serde_qs = { version = "0.12.0", features = ["actix4"] }
image = { git = "ssh://git@github.com/Moggers/image.git", branch = "sgi", features = ["sgi"] }
env_logger = "*"
log = "*"
lettre = "0.10.0-alpha.4"
actix-session = { version = "0.8.0", features = [ "cookie-session" ] }
flate2 = { version = "1.0.17", features = ["zlib"], default-features = false }
num-traits = "*"
num-derive = "*"
thiserror = "*"
chrono = "*"
crc = "*"
fletcher = "*"
reqwest = { version = "*", features = ["blocking", "json"] }
base64 = "*"
tungstenite = "*"
url = "*"
serde_json = "*"
rand = "*"
smol = "*"
sqlx = { version = "0.7", features = ["runtime-async-std-native-tls", "chrono", "postgres"] }
nonblock = "*"
async-std = "*"
derive_more = "*"
libvips = { git = "ssh://git@github.com/blitzserver/libvips-rust-bindings.git", commit = "e7b591d" }
encoding = "*"
itertools = "*"
bincode = "1.3.3"
html-node = "0.4.0"
serde_dom5 = { git = "ssh://git@github.com/blitzserver/serde_dom5", version = "0.1.0" }
walkdir = "2.4.0"

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]
