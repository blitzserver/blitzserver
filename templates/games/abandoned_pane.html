<div class="game-pane abandoned">
	<div class="left">
		<div class="header">
			<a class="title" href={{format!("game/{}#status", game.id)}}>{{ game.name }}</a>
			<section class="address">{{ game.address }}</section>
		</div>
		<div class="sep"></div>
		<div class="details">
      <section>Abandoned<span class="abandon-text-description">, <a href="/help#:~:text=Why did my game disappear?">will be archived</a> in {{ game.auto_archive_in }} unless there is <a href="/help#:~:text=submitting orders for an active game, or adding a pretender for games still in the lobby">activity</a>.</span></section>
		</div>
	</div>
	<div class="right">
		<img src="/images/maps/{{ game.map_id}}_100.webp" />
	</div>
</div>
