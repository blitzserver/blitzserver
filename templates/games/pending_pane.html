<div class="game-pane pending {% if game.joined %}playing{% endif %}">
	<div class="left">
		<div class="header">
			<a class="title" href={{format!("game/{}#status", game.id)}}>{{ game.name }}</a> <br>
			<section class="address">{{ game.address }}</section>
		</div>
		<div class="sep"></div>
		<div class="details">
			<section>Players {{ game.players }}/X</section>
      <section>{% if game.hosting %}Starting{% if game.fail_count> 0 %} (<span class="host-fail">Attempt #{{ game.fail_count + 1}}</span>){% endif %}{% endif %}</section>
		</div>
	</div>
	<div class="right">
    <img src="/maps/{{game.map_id}}/planes/0/thumb.webp?width=100" />
	</div>
</div>
