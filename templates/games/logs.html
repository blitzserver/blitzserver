<table class="log-table">
  {% for log in logs %}
  <tr 
    {% if log.reaped == true %} class="reaped" {% endif %}
    {% if log.finished_at.is_none() %} class="pending" {% endif %}
    >
    <td>{{log.started_at_str()}}</td>
    <td>Turn {{log.turn_number}}</td>
    <td>
      {% match log.game_logs %}
      {% when Some with (_) %}
      <a href="?log_output=#logs" class="btn btn-block">Hide Output</a>
      {% else %}
      <a href="?log_output={{log.job_id}}#logs" class="btn btn-block">View Output</a>
      {% endmatch %}
    </td>
  </tr>
  <tr>
    <td colspan="3">
      {% match log.game_logs %}
        {% when Some with (l) %}
          <pre>{{l}}</pre>
        {% else %}
      {% endmatch %}
    </td>
  </tr>
  {% endfor %}
</table>
