<!DOCTYPE html> 
<html lang="en">
	<head>
		<title>{% block title %}Blitzserver{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8" />
		{% block meta %}
		<meta name="description" content="Dominions 5 hosting service"/>
		{% endblock %}
		<link rel="stylesheet" href="/styles.css?{{ env!("CARGO_PKG_VERSION") }}">
    <link rel="icon" href="/favicon.png">
    <link rel="preload" as="image" href="/serpent-lay-front.webp">
    <link rel="preload" as="image" href="/serpent-lay-back.webp">
    <link rel="preload" as="image" href="/serpent-dancer.webp">
    <link rel="preload" as="image" href="/serpent-croc.webp">
	</head>
	<body>
    <div class="container {% block containerclass %}{% endblock %}">
      {% if crate::frontend::utils::rand_bool() %}
        <nav class="lizard-bg-alt">
      {% else %}
        <nav class="lizard-bg">
      {% endif %}
				<span class="title">Blitzserver</span>
				<a href="/games">games</a>
				<a href="/maps">maps</a>
				<a href="/mods">mods</a>
				<a href="/settings">settings</a>
				<a href="/help">about</a>
        <span class="version"><a href="{{ format!("https://github.com/blitzserver/blitzserver/releases/tag/{}", env!("CARGO_PKG_VERSION")) }}">{{env!("CARGO_PKG_VERSION")}}</a></span>
			</nav>
			{% block body%}{% endblock %}
		</div>
	</body>
</html>
