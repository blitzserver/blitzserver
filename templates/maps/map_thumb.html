<div class="map-thumb">
  <div class="map-thumb-radios">
    {% for i in 0..game.plane_count %}
      <label for="map-radio-{{game.id}}-{{i}}">{{i}}</label>
    {% endfor %}
  </div>
    {% for i in 0..game.plane_count %}
    <input type="radio" name="map-radio-{{game.id}}" id="map-radio-{{game.id}}-{{i}}" {% if i == 0 %} checked {% endif %} />
      <img class="map-thumb-img" src="/maps/{{game.id}}/planes/{{i}}/thumb.webp?width=100" />
    {% endfor %}
</div>
