{% extends "container.html" %}
{% block body %}
<div class="maps-page">
	<div class="map-upload">
		<div class="pane">
			<h3>Upload Map</h3>
      <form method="post" action="{{Self::get_upload_location()}}" enctype="multipart/form-data">
				<div class="input-group">
					<label for="map">Map Archive (.zip)</label>
					<input class="btn-file" required type="file" name="map"/>
				</div>
				{% if self.errors.len() > 0 %}
					<div class="error">
						<ul>
						{% for err in self.errors %}
							<li>{{err}}</li>
						{% endfor %}
						</ul>
					</div>
				{% endif %}
				<input type="submit" class="btn btn-block btn-primary" value="Upload"/>
			</form>
		</div>
    <img class='serpent-map' src="serpent-maps.webp" />
	</div>
	<div class="map-list">
		<div class="pane">
			<h3>Maps</h3>
			<div class="striped-table">
				{% for map in maps %}
				<div class="bg-selector" style="">
          <img src="/maps/{{map.map_id}}/planes/0/thumb.webp?crop_x=9999&crop_y=300" loading="lazy"/>
          <a href="/map/{{map.map_id}}">{{map.name}}</a>
					<a download="{{map.name}}.zip" class="btn" href="/map/{{map.map_id}}/download">Download</a>
				</div>
				{% endfor %}
			</div>
		</div>
	</div>
</div>
{% endblock %}
